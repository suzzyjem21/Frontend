<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
 <h2>list in html</h2>   
 <h2>unordered list</h2>
 <p>ul tag is used to define unordered list</p>
 <ul>

    <li>plantain</li>

    <ol type="A">
        <li>rice</li>
        <li>beans</li>
        <li>plantain</li>  
   </ol>
   <button style="background-color: blue; color:white;border-radius:8px">submit</button>
   <input style="background-color: blue;color: white;" type="submit">
</body>
</html>
