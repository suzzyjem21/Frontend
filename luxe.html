<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUSH STORE |Premium Fashion</title>
    <style>
        *{
            margin:0;
            padding: 0;
            box-sizing: border-box;
        }
        header{
            display: flex;
            flex-direction: column;
            height: 110px;
            width: 100%;
            margin-bottom:1px solid wheat;
        } 
        .head-top{
        background-color: black;
        display: flex;
        color: white;
        height: 35px;
        justify-content: center;
        align-items: center;
        
        }
        .head-bot{
            display: flex;
            background-color: white;
            height:55px;
            justify-content: space-between;
            align-items: center;
            height: 75px;
            padding-left: 80px;
            padding-right: 80px;
            box-shadow: 1px 2px 3px rgba(0,0,0,0.2);
        }
       
       
        .left{
            display: flex;
            gap:4px; 
        }
        .luxe{
            font-size: 2.5rem;
        }
        .dot{
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background-color: black;
            margin-top: 32px;
        }
        nav{
            display: flex;
            margin: auto;
            gap: 30px;
        }
        .right{
            display: flex;
            gap: 20px;
        }
        nav a{
            text-decoration: none;
            color: black;
        }
        nav:hover{
            color: blue;
        }
        .hero{
            background: linear-gradient(90deg, rgba(0, 0, 0, .75), rgba(0, 0, 0, .12)),
            url('https://images.unsplash.com/photo-1483985988355-763728e1935b?w=1800') center/cover
            no-repeat;
            min-height: 600px;
            
            
        }
        .text{
            display: flex;
            flex-direction: column;
            padding-top: 80px;
            padding-left: 40px;
            color: white;
            font-weight: bold;
            font-size: 1.2rem;
            
           
        }
        .text p{
            color: orange;
        }
        .text h2{
            font-size: 5.5rem;
            color: white;
        }
        button{
            margin-top: 20px;
            background-color:orangered;
            color: white;
            width: 200px;
            height:30px;
            border: 1px solid orangered;
        }
        #categories {
            display: flex;
            flex-direction: column;
            padding-top:50px;
            padding-left: 40px;
        }
        #categories h4{
            color:orange
        }
        .space{
            padding-top: 10px;
            display: flex;
            justify-content: space-between;
        }
           
        .space h2{
            font-size: 2.5rem;
        }
        .space p{
            font-size:1.2rem;
            font-weight: bold;
        }
        .shop{
            width:100%;
            height: 500px;
            display: flex;
            flex-direction: row;
            gap: 20px;
        }
        .card1{
            background: linear-gradient(90deg, rgba(0, 0, 0, .75), rgba(0, 0, 0, .12)),
            url(https://images.unsplash.com/photo-1483985988355-763728e1935b?w=700) center/cover
            no-repeat;
            width:350px;
            height:400px;  
        }
        .card2{
            background: linear-gradient(90deg, rgba(0, 0, 0, .75), rgba(0, 0, 0, .12)),
            url(https://images.unsplash.com/photo-1516257984-b1b4d707412e?w=700) center/cover
            no-repeat;
            width:350px;
            height:400px;  
        }
        .card3{
            background: linear-gradient(90deg, rgba(0, 0, 0, .75), rgba(0, 0, 0, .12)),
            url(https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=700) center/cover
            no-repeat;
            width:350px;
            height:400px;  
        }
        .card4{
            background: linear-gradient(90deg, rgba(0, 0, 0, .75), rgba(0, 0, 0, .12)),
            url(https://images.unsplash.com/photo-1548036328-c9fa89d128fa?w=700) center/cover
            no-repeat;
            width:350px;
            height:400px;  
        }
        
        

     </style>
</head>
<body>
    <header>
        <div class="head-top">
        <p>FREE SHIPPING ON ORDERS ABOVE #100,000</p>
      </div>
      <div class="head-bot">
        <div class="left">
            <div class="luxe">LUXE</div>
            <div class="dot">.</div>
        </div>
        <nav>
            <a href="#home">Home</a>
            <a href="#shop">Shop</a>
            <a href="#categories">Categories</a>
            <a href="#about">About</a>
        </nav>
        <div class="right">
        <div>⌕</div>
        <div>♙</div>
        <div>♧</div>
      </div>
    </header>
    <div class="hero">
        <div class="text">
            <p>NEW COLLECTION 2026</p>
        <h2>Style that <br> speaks for you</h2>
         Discover timeless fashion pieces designed to make every<br> moment unforgottable.
        <button>SHOP COLLECTION</button>
        </div>
    </div>

    <section id="categories">
        <h4>EXPLORE OUR STORE</h4>
        <div class="space">
            <h2>Shop by Category</h2>
            <p>View all ➡️</p>
        </div>
        <div class="shop">
            <div class="card1">
          
        </div>
        <div class="card2">
          
        </div>
        <div class="card3">
          
        </div>
        <div class="card4">
          
        </div>
        </div>
    </section>
 
</body>
</html>
