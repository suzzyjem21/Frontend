<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display:flex;
            width:500px;
            min-height: 100px;
            height: 300px;
            border-radius:15px;
            background-color: blue;
            gap: 20px;
            justify-content:space-around;
            flex-wrap: wrap-reverse;
            
        }
        div{
            background-color:green;
            color: white;
            width: 100px;
            height: 80px;
            text-align:center;
            display: flex;
            justify-content: center;
            align-items: center;
        
        }
    </style>
</head>
<body>
    <div class="container">
        <div>apple</div>
        <div>banana</div>
        <div>guava</div>
        <div>mango</div>
        <div>orange</div>
        <div>lemon</div>
        <div>pineapple</div>
        <div>citrus</div>

    </div>
</body>
</html>
