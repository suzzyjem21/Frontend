<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            background-color: blue;
            border-radius:10px;
            width: 100px;
            height: 100px;
            animation:example 4s normal infinite;
            position: relative;
        }
        @keyframes example{
0%{ background-color: blue; left:0; top:0;}
25%{ background-color: red;left: 200px;; top:0;}
50%{ background-color:orange;left: 200px;; top:200px;}
75%{ background-color:green;left: 0px; top:200px;}
100%{ background-color:purple;left:0; top:0;}
        }
    </style>
</head>
<body>
    <h2>Animaton in html</h2>
    <div class="box"></div>
</body>
</html>
