<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table{
            border:1px solid black;
            width: 100%;
            border-collapse:collapse;
            
        }
        th,td{
            border: 1px solid black;
            text-align: center;
        }
        tr :hover{
            background-color: blue;
            color: white;
        }
        tr:nth-child(2n+1) {
            background-color: green;
            color: white;
        }
        tr:nth-child(2n){
            background-color: grey;
            color: white;
        }

    </style>
</head>
<body>
    <h2>Tables in html</h2>   
    <p>table tag is used to define table in html</p>
    <p>tr is used to define table rows</p>
    <p>th is used to define table head</p>
    <p>td is used to define table data</p>
    <table>
        <caption>Students data</caption>
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>city</th>
        </tr>
        <tr>
            <td>fola wale</td>
            <td> 20</td>
            <td>Lagos</td>
        </tr>
        <tr>
            <td> fola yemi</td>
            <td>20 </td>
            <td>Ibadan</td>
        </tr>
        <tr>
            <td> bukola obute</td>
            <td>30 </td>
            <td>warri</td>  
        </tr>
        <tr>
            <td> Mejabi Jemima</td>
            <td>16</td>
            <td>Ibadan</td>     
        </tr>
    </table>
</body>
</html>
