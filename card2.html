<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .card{
            border-radius:15px;
            border:1px solid black;
            display: flex;
            flex-direction: column;
            margin: auto;
            width: 300px;
            min-height: 300px;
            align-items: center;
        


        }
        img{
            width:110px;
            height:100px;
            border-radius:50%;
            align-items: center;
            justify-content: center;
        }
        button{
            width: 100px;
            height: 40px;
            padding: 6px;
            border-radius: 8px;
            cursor:pointer;
            background-color: blue;
            color: white;
        }
        button:hover{
            background-color: royalblue;
            color: white;
            transform: scale(1.1);
            
        }
    p{ 
        text-align: center;
        padding-left: 10px;
        padding-right: 10px;
    }
    </style>
</head>
<body>
    <div class="card">
        <img src="meemah.jpeg.jpg" alt="profile picture" > 
        <h2> John Doe</h2>
        <p> web developer who love html,css and teaching begineers</P>

    <button>follow</button>
    </div>


</body>
</html>
