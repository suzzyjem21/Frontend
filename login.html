<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin:0;
            padding: 0;
            box-sizing:border-box;
        }
        button{
            color: white;
            background-color:green; 
            width:250px;
            height: 30px;
            padding: 5px;
            border-radius:10px;
        
        }
        form{ 
            background-color: purple;
            align-items: center;
            height:1000px;
            width:100%;
            margin-top: 20px;
            
        }
        body{
            justify-content: center;
        }
        
        div{

            background-color: white;
            color: black;
            width: 300px;
           min-height: 400px;
            border-radius:20px;
            display: flex;
            flex-direction: column;
            border:1px solid blueviolet;
            align-items: center;
             margin-left:500px;
               
        }
        input::placeholder{
            color:black;
        
        }
        div h2 {
            color: black;
        }
        input{
            width:250px;
            height: 30px;
            padding: 5px;
            border-radius:10px;
        }

    </style>
</head>
<body>
    <form>
        <div>
    <h2>Create account</h2>
    <p>Join AccountHub today</p><br>
    <h4>Full Name</h4>
    <input type="full Name" placeholder="John doe"><br>
    <h4>Email</h4>
    <input type="Email " placeholder="john@example.com"><br>
    <h4>Password</h4>
    <input type="password" placeholder=" at least 6 characters"><br><br>
    <button>sign up</button><br>
    <p> Already  have an account?<span style="background-color: white; color: blue;">sign up</span> </p>
</div>
</form>
</div>
   
</body>
</html>
